# libinput-gestures config
# 3-finger swipe left/right = switch workspaces on current output (macOS-like)
# 4-finger swipe = move focused container between workspaces on current output

gesture swipe left  3 i3-msg workspace next_on_output
gesture swipe right 3 i3-msg workspace prev_on_output

gesture swipe left  4 i3-msg move container to workspace next_on_output
gesture swipe right 4 i3-msg move container to workspace prev_on_output

# 3-finger swipe up = show all windows via rofi (closest lazy Mission Control)
gesture swipe up    3 rofi -show window
# 3-finger swipe down = show scratchpad (closest lazy App Expose)
gesture swipe down  3 i3-msg scratchpad show
