# Echo cancellation for the laptop's analog input (internal mic + headset jack
# mic share this ALSA source; the jack mic takes over when a headset is plugged).
#
# Echo reference = the monitor of the laptop's analog output (jack headphones /
# speakers), so sound leaking from earphones into the jack mic is subtracted.
#
# Shows up as an extra mic "Laptop mic (echo-cancelled)". Its priority beats the
# raw laptop mic, so it is picked by default; the polybar mic menu's
# "Echo cancel" toggle switches the default between the two. RNNoise
# (60-rnnoise.conf) then follows whichever is default.
#
# Machine-specific (sound card node names) — deployed only on this host,
# see .chezmoiignore.
context.modules = [
  { name = libpipewire-module-echo-cancel
    flags = [ nofail ]
    args = {
      library.name   = aec/libspa-aec-webrtc
      monitor.mode   = true
      audio.rate     = 48000
      audio.channels = 1
      aec.args = {
        webrtc.high_pass_filter  = true
        # RNNoise does the noise suppression; don't run two suppressors.
        webrtc.noise_suppression = false
        webrtc.gain_control      = false
      }
      capture.props = {
        node.name         = "capture.laptop_mic_aec"
        node.passive      = true
        target.object     = "alsa_input.pci-0000_06_00.6.analog-stereo"
        node.dont-fallback = true
      }
      source.props = {
        node.name        = "laptop_mic_aec"
        node.description = "Laptop mic (echo-cancelled)"
        priority.session = 2050
        # Read by the polybar mic menu to pair this with the raw mic.
        mic.aec.of       = "alsa_input.pci-0000_06_00.6.analog-stereo"
      }
      # monitor.mode: this is a capture stream of the output's monitor.
      sink.props = {
        node.name          = "echo_ref.laptop_mic_aec"
        node.passive       = true
        target.object      = "alsa_output.pci-0000_06_00.6.analog-stereo"
        node.dont-fallback = true
      }
    }
  }
]
