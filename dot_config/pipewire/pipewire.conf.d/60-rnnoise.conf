# RNNoise noise suppression for whichever mic is the default source.
#
# WirePlumber "smart filter" (WirePlumber >= 0.5): the filter never becomes the
# default source itself. It is transparently inserted between the default mic
# and every recording app, and follows the default when it changes (including
# newly plugged mics). The default source in pavucontrol / the polybar menu
# stays the real device.
#
# Live on/off (used by bin/polybar_volume_all.bash, per mic):
#   pw-metadata -n filters <node id of rnnoise_source> filter.smart.disabled true|false
#
# Needs: pacman -S noise-suppression-for-voice
# nofail: if the plugin is missing, PipeWire still starts (just without this).
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Noise suppression (RNNoise)"
      media.name       = "Noise suppression (RNNoise)"
      filter.graph = {
        nodes = [
          # Remove desk thumps / rumble below the voice range.
          { type = builtin name = hp label = bq_highpass control = { "Freq" = 90.0 } }
          { type = ladspa name = rnnoise plugin = "librnnoise_ladspa" label = noise_suppressor_mono
            control = { "VAD Threshold (%)" = 50.0 "VAD Grace Period (ms)" = 200 } }
          # Make-up gain: x3.375 = +10.6 dB = the 150% source volume found by
          # ear with the Seiren at 80%. Lower it if a loud mic clips.
          { type = builtin name = gain label = linear control = { "Mult" = 3.375 } }
        ]
        links = [
          { output = "hp:Out"         input = "rnnoise:Input" }
          { output = "rnnoise:Output" input = "gain:In" }
        ]
      }
      audio.rate     = 48000
      audio.position = [ MONO ]
      capture.props = {
        node.name    = "capture.rnnoise_source"
        node.passive = true
      }
      playback.props = {
        node.name         = "rnnoise_source"
        media.class       = Audio/Source
        filter.smart      = true
        filter.smart.name = "rnnoise"
      }
    }
  }
]
