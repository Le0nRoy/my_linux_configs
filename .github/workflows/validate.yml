name: validate

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Bash syntax check
        run: |
          find . \( -path './.git' -prune \) -o \
            \( \( -name '*.bash' -o -name '*.sh' \) -print \) \
            | sort \
            | xargs -I{} bash -n {}

      - name: ShellCheck
        uses: reviewdog/action-shellcheck@853366d6a4afe65985b8f9ba43924a4afc0a45c9  # v1.32.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          fail_level: warning
          path: "."
          pattern: "*.bash *.sh"

      - name: .gitmodules HTTPS regression check
        run: |
          if [ ! -f .gitmodules ]; then
            echo "OK: no .gitmodules (no submodules)"
            exit 0
          fi
          if grep -E 'url\s*=' .gitmodules | grep -qv 'https://'; then
            echo "ERROR: SSH URL found in .gitmodules"
            exit 1
          fi
          echo "OK: all .gitmodules URLs use HTTPS"

      - name: chezmoi.toml TOML validation
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          path = 'dot_config/chezmoi/chezmoi.toml'
          tmpl_path = path + '.tmpl'
          if os.path.exists(path):
              with open(path, 'rb') as f:
                  tomllib.load(f)
              print('OK:', path, 'is valid TOML')
          elif os.path.exists(tmpl_path):
              print('OK:', tmpl_path, 'is a chezmoi template — TOML validation skipped (requires rendering)')
          else:
              print('ERROR: neither', path, 'nor', tmpl_path, 'found', file=sys.stderr)
              raise SystemExit(1)
          EOF
