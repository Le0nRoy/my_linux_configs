name: tests

# Runs every registered tests/test_*.bash through tests/run_all.bash in strict
# mode (CI is set, and TESTS_STRICT=1): a SKIP for a missing tool fails the run.
#
# Known blocker: the checkout needs the ai-wrapper commit the parent pins
# (gitlink) to exist on the ai-wrapper remote. While that commit is local-only,
# the submodule checkout (and test_agent_skill_distribution.bash) fails here;
# that is intended, so do not weaken strict mode to get around it.

on:
  pull_request:
  workflow_dispatch:

env:
  # tmux: Ubuntu 24.04 ships 3.4, whose `show-options -v` escapes `$`, so the
  # tmux-resurrect hooks in tmux.conf (`"${HOME}/bin/..."`) never run there.
  # Pinned to the release the tests are developed against.
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  # bash 3.2 (macOS /bin/bash) for the `bash32` section of
  # test_tmux_preservation.bash, built from GNU source. The section runs the
  # real-tmux Linux fixture, so it cannot move to a macOS runner.
  BASH32_VERSION: "3.2.57"
  BASH32_SHA256: 3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4
  CHEZMOI_VERSION: "2.74.0"
  CHEZMOI_SHA256: 1b98a567f726f41540414aea4caf912699d53e248b29ccf8369cf553657b2374
  TOOLS_DIR: /home/runner/.cache/chezmoi-ci/tools

jobs:
  tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: recursive

      - name: Install packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            zsh python3 bash-completion git rsync lsof systemd \
            build-essential pkg-config bison libevent-dev libncurses-dev

      - name: Cache built tools (tmux, bash 3.2)
        id: tools-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-ubuntu-24.04-tmux-${{ env.TMUX_VERSION }}-bash-${{ env.BASH32_VERSION }}-v1

      - name: Build tmux and bash 3.2
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/src"
          mkdir -p "${src}" "${TOOLS_DIR}"
          cd "${src}"
          curl -fsSLo tmux.tar.gz "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/tmux-${TMUX_VERSION}.tar.gz"
          echo "${TMUX_SHA256}  tmux.tar.gz" | sha256sum -c -
          tar xzf tmux.tar.gz
          (cd "tmux-${TMUX_VERSION}" && ./configure --prefix="${TOOLS_DIR}/tmux" && make -j"$(nproc)" && make install)
          curl -fsSLo bash.tar.gz "https://ftp.gnu.org/gnu/bash/bash-${BASH32_VERSION}.tar.gz"
          echo "${BASH32_SHA256}  bash.tar.gz" | sha256sum -c -
          tar xzf bash.tar.gz
          # Pre-C99 sources: modern gcc rejects K&R prototypes unless gnu89.
          (cd "bash-${BASH32_VERSION}" \
            && CC="gcc -std=gnu89" CFLAGS="-O2 -w" ./configure --prefix="${TOOLS_DIR}/bash32" \
                 --without-bash-malloc --disable-nls \
            && make -j"$(nproc)" && make install)

      - name: Install chezmoi
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSLo chezmoi.tar.gz "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          echo "${CHEZMOI_SHA256}  chezmoi.tar.gz" | sha256sum -c -
          mkdir -p "${TOOLS_DIR}/chezmoi"
          tar xzf chezmoi.tar.gz -C "${TOOLS_DIR}/chezmoi" chezmoi
          echo "${TOOLS_DIR}/chezmoi" >> "${GITHUB_PATH}"
          echo "${TOOLS_DIR}/tmux/bin" >> "${GITHUB_PATH}"

      - name: Tool versions
        run: |
          tmux -V
          chezmoi --version
          "${TOOLS_DIR}/bash32/bin/bash" -c 'echo "bash32 ${BASH_VERSION}"'
          zsh --version
          python3 --version
          systemd-analyze --version | head -n 1

      # Key: the three plugin pins (tpm from the installer, resurrect and
      # continuum from the test), not the whole files.
      - name: tmux plugin pins
        id: plugin-pins
        run: |
          pins=$( { grep -E '^TPM_TAG_SHA="[0-9a-f]{40}"$' run_once_install-tpm-plugins.bash
                    grep -oE '"tmux-(resurrect|continuum) [0-9a-f]{40}"' tests/test_tmux_preservation.bash
                  } | sort)
          [ "$(printf '%s\n' "${pins}" | wc -l)" -eq 3 ] || { echo "expected 3 plugin pins, got: ${pins}"; exit 1; }
          echo "hash=$(printf '%s\n' "${pins}" | sha256sum | cut -c1-16)" >> "${GITHUB_OUTPUT}"

      - name: Cache tmux plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/chezmoi-tests/tmux-plugins
          key: tmux-plugins-${{ steps.plugin-pins.outputs.hash }}

      - name: Run tests (strict)
        env:
          TESTS_STRICT: "1"
        run: BASH32="${TOOLS_DIR}/bash32/bin/bash" bash tests/run_all.bash
